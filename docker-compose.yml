x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-production}
  APP_PORT: ${APP_PORT:-3001}
  APP_NAME: ${APP_NAME:-Mandor Plate API}
  API_PREFIX: ${API_PREFIX:-api}
  APP_FALLBACK_LANGUAGE: ${APP_FALLBACK_LANGUAGE:-en}
  APP_HEADER_LANGUAGE: ${APP_HEADER_LANGUAGE:-x-custom-lang}
  FRONTEND_DOMAIN: ${APP_URL:-http://localhost:3000}
  BACKEND_DOMAIN: ${APP_URL:-http://localhost:3000}
  DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_HOST: ${DATABASE_HOST:-}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_USERNAME: ${DATABASE_USERNAME:-}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
  DATABASE_NAME: ${DATABASE_NAME:-}
  DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
  DATABASE_SSL_ENABLED: ${DATABASE_SSL_ENABLED:-true}
  DATABASE_REJECT_UNAUTHORIZED: ${DATABASE_REJECT_UNAUTHORIZED:-true}
  DATABASE_CA: ${DATABASE_CA:-}
  DATABASE_KEY: ${DATABASE_KEY:-}
  DATABASE_CERT: ${DATABASE_CERT:-}
  FILE_DRIVER: ${FILE_DRIVER:-local}
  ACCESS_KEY_ID: ${ACCESS_KEY_ID:-}
  SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY:-}
  AWS_S3_REGION: ${AWS_S3_REGION:-}
  AWS_DEFAULT_S3_BUCKET: ${AWS_DEFAULT_S3_BUCKET:-}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_IGNORE_TLS: ${MAIL_IGNORE_TLS:-false}
  MAIL_SECURE: ${MAIL_SECURE:-false}
  MAIL_REQUIRE_TLS: ${MAIL_REQUIRE_TLS:-true}
  MAIL_DEFAULT_EMAIL: ${MAIL_DEFAULT_EMAIL:-noreply@example.com}
  MAIL_DEFAULT_NAME: ${MAIL_DEFAULT_NAME:-Mandor Plate}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
  AUTH_JWT_TOKEN_EXPIRES_IN: ${AUTH_JWT_TOKEN_EXPIRES_IN:-15m}
  AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:-}
  AUTH_REFRESH_TOKEN_EXPIRES_IN: ${AUTH_REFRESH_TOKEN_EXPIRES_IN:-30d}
  AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET:-}
  AUTH_FORGOT_TOKEN_EXPIRES_IN: ${AUTH_FORGOT_TOKEN_EXPIRES_IN:-30m}
  AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET:-}
  AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: ${AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN:-1d}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-System}
  BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Admin}

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        'sh',
        '-c',
        'node apps/api/dist/database/run-migrations.js && node apps/api/dist/database/seeds/relational/run-production-seed.js && exec node apps/api/dist/main.js',
      ]
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - uploaded-files:/app/files

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: http://api:3001
      AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:-2592000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploaded-files:
