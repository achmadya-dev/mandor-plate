name: Feature request
description: Suggest an improvement to the boilerplate
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for improvements to the reusable boilerplate, not product-specific implementation requests.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or product setup problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
